<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penyeliaan - Jabatan Kecemasan & Trauma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-dark: #0f172a;    
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.98);

      /* Floating Header & Footer Variables */
      --bg-base: #050914;
      --accent: #D4AF37;
      --accent-glow: rgba(212, 175, 55, 0.5);
      --text-main: #F8FAFC;
      --footer-text-muted: #94A3B8;
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    /* Ruang selamat supaya kandungan utama tidak terlindung oleh header/footer terapung */
    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 120px 1rem 120px 1rem;
    }

    /* --- FLOATING HEADER --- */
    nav {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1050px;
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 10px 20px 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: slideDown 0.8s ease-out forwards;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .dept-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      border-radius: 50%;
      background: var(--text-main);
      padding: 2px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.15;
    }

    .logo-text span {
      display: block;
      font-size: 0.68rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .nav-home-btn svg {
      width: 16px;
      height: 16px;
    }

    .nav-home-btn:hover {
      background: var(--accent);
      color: var(--bg-base);
      box-shadow: 0 0 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    .app-wrapper { width: 100%; max-width: 600px; margin: auto; }

    .elegant-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    
    .btn-back {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #f1f5f9; transform: translateX(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: var(--primary-dark); }

    .header-title { font-weight: 800; color: var(--primary-dark); font-size: 1.1rem; margin: 0; }
    .header-subtitle { font-weight: 600; color: var(--accent-blue); font-size: 0.75rem; text-transform: uppercase; }

    .form-control {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      background-color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    
    .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; letter-spacing: 0.5px; text-transform: uppercase; }

    .section-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary-dark);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
    }

    .btn-elegant-primary {
      background-color: var(--primary-dark);
      color: #ffffff;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 0.95rem;
      border: none;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    .btn-elegant-primary:hover { background-color: #1e293b; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(15, 23, 42, 0.15); color: #fff; }

    /* --- FLOATING FOOTER --- */
    footer {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1050px;
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 10px 24px;
      color: var(--footer-text-muted);
      font-size: 0.82rem;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideUpFooter 0.8s ease-out forwards;
    }

    .footer-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-logos img {
      height: 30px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s;
    }

    .footer-logos img:hover {
      transform: scale(1.05);
    }

    .logo-divider {
      width: 1px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.15);
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      letter-spacing: 1px;
      font-weight: 500;
      font-size: 0.78rem;
      background: rgba(212, 175, 55, 0.06);
      padding: 5px 14px;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }

    .footer-copyright {
      margin: 0;
      letter-spacing: 0.4px;
      text-align: right;
      white-space: nowrap;
    }

    .footer-copyright span {
      color: var(--text-main);
      font-weight: 500;
    }

    /* --- ANIMASI & RESPONSIF --- */
    @keyframes slideDown {
      from { top: -100px; opacity: 0; }
      to { top: 18px; opacity: 1; }
    }

    @keyframes slideUpFooter {
      from { bottom: -100px; opacity: 0; }
      to { bottom: 18px; opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @media (max-width: 768px) {
      nav { width: 94%; padding: 9px 14px 9px 16px; border-radius: 40px; top: 12px; }
      .logo-text { font-size: 0.92rem; }
      .logo-text span { font-size: 0.62rem; }
      .dept-logo { height: 32px; }
      .nav-home-btn { padding: 7px 12px; }
      .nav-home-btn span { display: none; }

      main { padding-top: 105px; padding-bottom: 105px; }

      footer { width: 94%; bottom: 12px; padding: 8px 16px; border-radius: 40px; }
      .footer-logos img { height: 24px; }
      .footer-status { display: none; }
      .footer-copyright { font-size: 0.74rem; }
    }

    @media (max-width: 480px) {
      .elegant-card { padding: 1.5rem; }
      .header-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- FLOATING HEADER -->
  <nav>
    <a href="index.html" class="logo-group">
      <img src="https://lh3.googleusercontent.com/d/1O2Nj1Dr4U6wo7ISjdkDRukPYwZUkOOuJ" alt="Logo Jabatan" class="dept-logo">
      <div class="logo-text">
        Hospital Kuala Nerang
        <span>Jabatan Kecemasan &amp; Trauma</span>
      </div>
    </a>

    <a href="index.html" class="nav-home-btn" title="Kembali ke Laman Utama">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Laman Utama</span>
    </a>
  </nav>

  <!-- KANDUNGAN UTAMA -->
  <main>
    <div class="app-wrapper">
      
      <!-- HEADER NAV -->
      <div class="nav-header">
        <a href="index.html" class="btn-back text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Utama
        </a>
        <div class="text-end">
          <h6 class="header-title">Laporan Penyeliaan</h6>
          <div id="userDisplay" class="header-subtitle">Memuatkan sesi...</div>
        </div>
      </div>

      <!-- ALERT BOX -->
      <div id="alertBox" class="alert d-none elegant-card text-center fw-bold py-3 mb-3 small" style="padding: 1rem!important; border-radius: 12px;" role="alert"></div>

      <!-- DOWNLOAD SECTION (HIDDEN BY DEFAULT) -->
      <div id="downloadSection" class="elegant-card mb-3 text-center d-none" style="padding: 1.5rem;">
        <h6 class="text-success fw-bold m-0 mb-3"><i class="fa-solid fa-circle-check me-1"></i> Laporan Berjaya Dihantar!</h6>
        <a id="btnDownloadPDF" href="#" target="_blank" class="btn btn-elegant-primary w-100 m-0" style="background-color: #16a34a;">
          <i class="fa-solid fa-file-arrow-down me-2"></i> Muat Turun PDF Laporan
        </a>
        <button class="btn btn-link text-muted mt-2 small text-decoration-none" onclick="resetForm()">
          <i class="fa-solid fa-rotate-right me-1"></i> Hantar Laporan Baharu
        </button>
      </div>

      <!-- FORM SECTION -->
      <div id="formSection" class="elegant-card">
        <form id="penyeliaanForm" onsubmit="event.preventDefault(); submitReport();">
          <div class="section-title">
            <i class="fa-solid fa-hospital-user me-2" style="color: var(--accent-blue);"></i> Bilangan Pesakit Semasa
          </div>
          
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label text-danger">🔴 Red Zone</label>
              <input type="number" id="redZone" class="form-control" value="0" min="0">
            </div>
            <div class="col-6">
              <label class="form-label" style="color: #d97706;">🟡 Yellow Zone</label>
              <input type="number" id="yellowZone" class="form-control" value="0" min="0">
            </div>
            <div class="col-6">
              <label class="form-label text-success">🟢 Green Zone</label>
              <input type="number" id="greenZone" class="form-control" value="0" min="0">
            </div>
            <div class="col-6">
              <label class="form-label text-info">🫁 Asthma Bay</label>
              <input type="number" id="asthmaBay" class="form-control" value="0" min="0">
            </div>
            <div class="col-6">
              <label class="form-label" style="color: var(--primary-dark);">🛋️ Obs Bay</label>
              <input type="number" id="observationBay" class="form-control" value="0" min="0">
            </div>
            <div class="col-6">
              <label class="form-label text-secondary">⏳ Awaiting Adm.</label>
              <input type="number" id="awaitingAdmission" class="form-control" value="0" min="0">
            </div>
            
            <!-- INPUT JUMLAH KESELURUHAN MANUAL -->
            <div class="col-12 mt-3 pt-3 border-top">
              <label class="form-label" style="color: var(--primary-dark); font-size: 0.85rem;">👥 Jumlah Keseluruhan Pesakit</label>
              <input type="number" id="jumlahPesakit" class="form-control text-primary" style="font-size: 1.1rem;" value="0" min="0" required>
            </div>
          </div>

          <div class="section-title mt-2">
            <i class="fa-solid fa-clipboard-list me-2" style="color: var(--accent-blue);"></i> Ulasan &amp; Tindakan
          </div>

          <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> Isu / Masalah Berbangkit:</label>
            <textarea id="inputMasalah" class="form-control" rows="2" placeholder="Taipkan rincian masalah jika ada..."></textarea>
          </div>

          <div class="mb-2">
            <label class="form-label"><i class="fa-solid fa-list-check text-success me-1"></i> Tindakan Susulan (Jika Perlu):</label>
            <textarea id="inputTindakan" class="form-control" rows="2" placeholder="Taipkan tindakan yang telah diambil..."></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="btn-elegant-primary w-100">
            <i class="fa-solid fa-file-pdf me-2"></i>Jana PDF &amp; Hantar E-Mel
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- FLOATING FOOTER -->
  <footer>
    <div class="footer-container">
      <div class="footer-logos">
        <img src="https://lh3.googleusercontent.com/d/1O2Nj1Dr4U6wo7ISjdkDRukPYwZUkOOuJ" alt="HKN Logo">
        <div class="logo-divider"></div>
        <img src="https://lh3.googleusercontent.com/d/1LdMRx-PF49CWOcrjthClGLJg-yQoJ2mt" alt="MOH Logo">
      </div>

      <div class="footer-status">
        <span class="pulse-dot"></span>
        <span>EDHKN PORTAL Ver 2.0</span>
      </div>

      <p class="footer-copyright">© 2026 <span>EDHKN</span> | All Rights Reserved</p>
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";
    let currentUser = null;

    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = JSON.parse(user);
        document.getElementById('userDisplay').innerText = currentUser.nama;
      }
    };

    function playSuccessSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.15, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.connect(gain1); gain1.connect(ctx.destination);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.2, ctx.currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination);

        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.15);
        osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      const bg = type === 'success' ? '#dcfce7' : '#fee2e2';
      const color = type === 'success' ? '#16a34a' : '#dc2626';
      
      box.style.backgroundColor = bg;
      box.style.color = color;
      box.style.borderColor = color;
      box.innerText = msg;
      box.classList.remove('d-none');
    }

    function resetForm() {
      document.getElementById('penyeliaanForm').reset();
      document.getElementById('downloadSection').classList.add('d-none');
      document.getElementById('formSection').classList.remove('d-none');
      document.getElementById('alertBox').classList.add('d-none');
      
      ['redZone', 'yellowZone', 'greenZone', 'asthmaBay', 'observationBay', 'awaitingAdmission', 'jumlahPesakit'].forEach(id => {
        document.getElementById(id).value = "0";
      });
    }

    async function submitReport() {
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Menjana Dokumen...';

      const payload = {
        action: 'submitReport',
        currentUser: currentUser,
        data: {
          redZone: document.getElementById('redZone').value || 0,
          yellowZone: document.getElementById('yellowZone').value || 0,
          greenZone: document.getElementById('greenZone').value || 0,
          asthmaBay: document.getElementById('asthmaBay').value || 0,
          observationBay: document.getElementById('observationBay').value || 0,
          awaitingAdmission: document.getElementById('awaitingAdmission').value || 0,
          jumlahPesakit: document.getElementById('jumlahPesakit').value || 0,
          masalah: document.getElementById('inputMasalah').value.trim(),
          tindakan: document.getElementById('inputTindakan').value.trim()
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const responseText = await res.text();
        
        if (responseText.trim().startsWith("<")) {
          throw new Error("Penyedia Backend mengembalikan maklum balas HTML. Sila semak Apps Script.");
        }

        const data = JSON.parse(responseText);
        
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-2"></i>Jana PDF & Hantar E-Mel';

        if (data.success) {
          showAlert(data.message, 'success');
          playSuccessSound();
          
          if (data.pdfDownloadUrl || data.pdfUrl) {
            document.getElementById('btnDownloadPDF').href = data.pdfDownloadUrl || data.pdfUrl;
            document.getElementById('downloadSection').classList.remove('d-none');
            document.getElementById('formSection').classList.add('d-none');
          }
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (err) {
        showAlert('Ralat API: ' + err.message, 'danger');
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-2"></i>Jana PDF & Hantar E-Mel';
      }
    }
  </script>
</body>
</html>
