<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringkasan Laporan PHC - Jabatan Kecemasan & Trauma</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-dark: #0f172a;
      --accent-blue: #0284c7;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.98);

      /* Floating Header & Footer Variables */
      --bg-base: #050914;
      --accent: #D4AF37;
      --accent-glow: rgba(212, 175, 55, 0.5);
      --text-main: #F8FAFC;
      --footer-text-muted: #94A3B8;
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    /* Ruang selamat supaya kandungan utama tidak terlindung oleh header/footer terapung */
    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 120px 1rem 120px 1rem;
    }

    /* --- FLOATING HEADER --- */
    nav {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1050px;
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 10px 20px 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: slideDown 0.8s ease-out forwards;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .dept-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      border-radius: 50%;
      background: var(--text-main);
      padding: 2px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.15;
    }

    .logo-text span {
      display: block;
      font-size: 0.68rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .nav-home-btn svg {
      width: 16px;
      height: 16px;
    }

    .nav-home-btn:hover {
      background: var(--accent);
      color: var(--bg-base);
      box-shadow: 0 0 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Responsive Wrapper */
    .app-wrapper {
      width: 100%;
      max-width: 750px;
      margin: auto;
    }

    /* Elegant Card Design */
    .elegant-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      padding: 1.5rem 2rem;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
    }

    /* Header Nav */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .btn-back {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #f1f5f9;
      transform: translateX(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      color: var(--primary-dark);
    }

    .header-title { font-weight: 800; color: var(--primary-dark); font-size: 1.1rem; margin: 0; }

    /* Elegant Select Filter */
    .filter-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      border: 1px solid #e2e8f0;
    }
    
    .filter-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary-dark);
      margin: 0;
      display: flex;
      align-items: center;
    }

    .form-select {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      border-radius: 8px;
      padding: 0.4rem 2rem 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      width: auto;
      min-width: 180px;
      cursor: pointer;
    }
    .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* Elegant Table */
    .table-container {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .table { margin: 0; font-size: 0.85rem; }
    .table thead { background-color: #f8fafc; }
    .table th {
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      padding: 1rem;
      border-bottom: 2px solid #e2e8f0;
    }
    .table td {
      padding: 1rem;
      vertical-align: middle;
      color: var(--primary-dark);
      border-bottom: 1px solid #f1f5f9;
    }
    .table tbody tr:hover { background-color: #f8fafc; }

    /* Badges */
    .badge { padding: 0.35em 0.6em; border-radius: 6px; font-weight: 700; font-size: 0.7rem; }
    .badge-p1 { background-color: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-p2 { background-color: #fffbeb; color: #d97706; border: 1px solid #fcd34d; }
    .badge-p3 { background-color: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .badge-p4 { background-color: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; }

    .btn-pdf {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn-pdf:hover {
      background: #dc2626;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(220, 38, 38, 0.2);
    }

    /* --- FLOATING FOOTER --- */
    footer {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1050px;
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 10px 24px;
      color: var(--footer-text-muted);
      font-size: 0.82rem;
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideUpFooter 0.8s ease-out forwards;
    }

    .footer-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      width: 100%;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-logos img {
      height: 30px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s;
    }

    .footer-logos img:hover {
      transform: scale(1.05);
    }

    .logo-divider {
      width: 1px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.15);
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      letter-spacing: 1px;
      font-weight: 500;
      font-size: 0.78rem;
      background: rgba(212, 175, 55, 0.06);
      padding: 5px 14px;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }

    .footer-copyright {
      margin: 0;
      letter-spacing: 0.4px;
      text-align: right;
      white-space: nowrap;
    }

    .footer-copyright span {
      color: var(--text-main);
      font-weight: 500;
    }

    /* --- ANIMASI & RESPONSIF --- */
    @keyframes slideDown {
      from { top: -100px; opacity: 0; }
      to { top: 18px; opacity: 1; }
    }

    @keyframes slideUpFooter {
      from { bottom: -100px; opacity: 0; }
      to { bottom: 18px; opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @media (max-width: 768px) {
      nav { width: 94%; padding: 9px 14px 9px 16px; border-radius: 40px; top: 12px; }
      .logo-text { font-size: 0.92rem; }
      .logo-text span { font-size: 0.62rem; }
      .dept-logo { height: 32px; }
      .nav-home-btn { padding: 7px 12px; }
      .nav-home-btn span { display: none; }

      main { padding-top: 105px; padding-bottom: 105px; }

      footer { width: 94%; bottom: 12px; padding: 8px 16px; border-radius: 40px; }
      .footer-logos img { height: 24px; }
      .footer-status { display: none; }
      .footer-copyright { font-size: 0.74rem; }
    }

    @media (max-width: 576px) {
      .elegant-card { padding: 1.25rem; }
      .filter-wrapper { flex-direction: column; align-items: flex-start; gap: 10px; }
      .form-select { width: 100%; }
      .table th, .table td { padding: 0.75rem 0.5rem; font-size: 0.8rem; }
      .btn-pdf { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <!-- FLOATING HEADER -->
  <nav>
    <a href="index.html" class="logo-group">
      <img src="https://lh3.googleusercontent.com/d/1O2Nj1Dr4U6wo7ISjdkDRukPYwZUkOOuJ" alt="Logo Jabatan" class="dept-logo">
      <div class="logo-text">
        Hospital Kuala Nerang
        <span>Jabatan Kecemasan &amp; Trauma</span>
      </div>
    </a>

    <a href="index.html" class="nav-home-btn" title="Kembali ke Laman Utama">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Laman Utama</span>
    </a>
  </nav>

  <!-- KANDUNGAN UTAMA -->
  <main>
    <div class="app-wrapper">
      
      <!-- HEADER NAV -->
      <div class="nav-header">
        <a href="laporanphc.html" class="btn-back text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Borang PHC
        </a>
        <h6 class="header-title">Ringkasan Laporan PHC</h6>
      </div>

      <!-- FILTER SECTION -->
      <div class="elegant-card p-3">
        <div class="filter-wrapper">
          <p class="filter-label"><i class="fa-solid fa-filter me-2 text-primary"></i> Penapis Rekod:</p>
          <select id="dateRangeSelect" class="form-select" onchange="loadSummary()">
            <option value="">10 Kes Terkini</option>
            <option value="today">Hari Ini</option>
            <option value="7days">7 Hari Terakhir</option>
            <option value="30days">30 Hari Terakhir</option>
            <option value="all">Semua Rekod</option>
          </select>
        </div>
      </div>

      <!-- TABLE SECTION -->
      <div class="elegant-card p-0 overflow-hidden">
        <div class="table-container table-responsive">
          <table class="table table-hover align-middle m-0">
            <thead>
              <tr>
                <th>Tarikh &amp; Masa</th>
                <th>Kad / Jenis Kes</th>
                <th>Penyelia PHC</th>
                <th class="text-center">Tindakan</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody">
              <tr>
                <td colspan="4" class="text-center py-5 text-muted">
                  <i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i><br>
                  <span class="fw-semibold">Menarik rekod pelayan...</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- FLOATING FOOTER -->
  <footer>
    <div class="footer-container">
      <div class="footer-logos">
        <img src="https://lh3.googleusercontent.com/d/1O2Nj1Dr4U6wo7ISjdkDRukPYwZUkOOuJ" alt="HKN Logo">
        <div class="logo-divider"></div>
        <img src="https://lh3.googleusercontent.com/d/1LdMRx-PF49CWOcrjthClGLJg-yQoJ2mt" alt="MOH Logo">
      </div>

      <div class="footer-status">
        <span class="pulse-dot"></span>
        <span>EDHKN PORTAL Ver 2.0</span>
      </div>

      <p class="footer-copyright">© 2026 <span>EDHKN</span> | All Rights Reserved</p>
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";

    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      loadSummary();
    };

    async function loadSummary() {
      const range = document.getElementById('dateRangeSelect').value;
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i><br><span class="fw-semibold">Memproses carian rekod...</span></td></tr>`;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getPHCSummary', dateRange: range })
        });

        const data = await res.json();
        
        if (data.success && data.list.length > 0) {
          tbody.innerHTML = '';
          data.list.forEach(item => {
            let badgeClass = 'badge-p4';
            if (item.priority === 'P1') badgeClass = 'badge-p1';
            if (item.priority === 'P2') badgeClass = 'badge-p2';
            if (item.priority === 'P3') badgeClass = 'badge-p3';

            tbody.innerHTML += `
              <tr>
                <td class="fw-semibold text-muted" style="font-size: 0.8rem;">${item.tarikh}</td>
                <td>
                  <span class="badge ${badgeClass} mb-1">${item.priority}</span> 
                  <span class="fw-bold d-inline-block ms-1">${item.callCard}</span><br>
                  <span class="text-muted" style="font-size: 0.75rem;">${item.caseType}</span>
                </td>
                <td class="fw-medium">${item.pppResponder}</td>
                <td class="text-center">
                  <a href="${item.pdfUrl}" target="_blank" class="btn btn-pdf text-decoration-none" title="Muat Turun PDF">
                    <i class="fa-solid fa-file-pdf"></i>
                  </a>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted fw-medium"><i class="fa-solid fa-folder-open mb-2 fa-2x opacity-50"></i><br>Tiada rekod ditemui untuk julat tarikh ini.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger fw-semibold"><i class="fa-solid fa-circle-exclamation me-2"></i>Ralat menyambung ke pangkalan data. Sila muat semula halaman.</td></tr>`;
      }
    }
  </script>
</body>
</html>
